<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Simulation & Modeling — Study Portal | BCE7026</title>
<meta name="description" content="Gamified study portal for Simulation & Modeling BCE7026 - Purbanchal University">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
/* Layout, colour, type and rhythm tokens now live in assets/css/tokens.css
   (loaded above) so there is one source of truth for the whole portal. */
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t1);overflow:hidden;height:100vh;font-size:14.5px;line-height:1.7;transition:background .3s,color .3s}
h1,h2,h3,h4,h5{line-height:1.35;font-weight:700;color:var(--t1)}
a{color:var(--pri);text-decoration:none}
::selection{background:var(--pri);color:#fff}
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--bg-side);border-right:1px solid var(--brd);display:flex;flex-direction:column;flex-shrink:0;z-index:100;transition:var(--tr)}
.s-head{padding:18px 16px;border-bottom:1px solid var(--brd)}
.logo{display:flex;align-items:center;gap:11px}
.logo-i{width:42px;height:42px;background:linear-gradient(135deg,var(--pri),#3b4299);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}
.logo-t h1{font-size:14px;font-weight:700;letter-spacing:-.3px}
.logo-t p{font-size:11px;color:var(--t3);margin-top:1px}

/* XP BAR */
.xp-section{padding:12px 16px;border-bottom:1px solid var(--brd)}
.xp-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.xp-label span{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px}
.xp-label .xp-val{color:var(--pri);font-size:13px}
.xp-bar{height:8px;background:var(--bg-input);border-radius:4px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--sec));border-radius:4px;transition:width .6s ease}
.xp-stats{display:flex;gap:8px;margin-top:8px}
.xp-stat{flex:1;text-align:center;padding:6px 4px;background:var(--bg-input);border-radius:6px;font-size:11px;color:var(--t2)}
.xp-stat .num{display:block;font-size:16px;font-weight:800;color:var(--t1)}
.xp-stat .lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}

.ch-nav{flex:1;overflow-y:auto;padding:8px 10px;scrollbar-width:thin;scrollbar-color:var(--brd) transparent}
.ch-nav::-webkit-scrollbar{width:4px}
.ch-nav::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--tr);margin-bottom:2px;border:1px solid transparent;position:relative}
.nav-item:hover{background:var(--bg-side-h)}
.nav-item.active{background:var(--bg-side-a);border-color:var(--pri-bd)}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;height:60%;width:3px;background:var(--pri);border-radius:0 3px 3px 0}
.nav-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bg-input);color:var(--t3);flex-shrink:0;transition:var(--tr)}
.nav-item.active .nav-num{background:var(--pri);color:#fff}
.nav-item.done .nav-num{background:var(--sec);color:#fff}
.nav-label{font-size:12px;font-weight:500;color:var(--t2);line-height:1.3;flex:1}
.nav-item.active .nav-label{color:var(--t1);font-weight:600}
.nav-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.nav-marks{font-size:9px;color:var(--t3);background:var(--bg-input);padding:1px 6px;border-radius:8px;font-weight:600}
.nav-prog{width:36px;height:3px;background:var(--bg-input);border-radius:2px;overflow:hidden}
.nav-prog-fill{height:100%;background:var(--sec);border-radius:2px;transition:width .4s ease}
.s-foot{padding:12px 16px;border-top:1px solid var(--brd)}
.s-foot p{font-size:10px;color:var(--t3);text-align:center;line-height:1.5}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:var(--header-h);background:var(--bg-card);border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;box-shadow:var(--sh)}
.topbar-l{display:flex;align-items:center;gap:12px;min-width:0}
.menu-btn{background:var(--bg-input);border:1px solid var(--brd);color:var(--t2);width:36px;height:36px;border-radius:var(--radius-sm);cursor:pointer;font-size:16px;line-height:1;transition:var(--tr)}
.menu-btn:hover{background:var(--bg-side-h)}
.ch-ti{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-badge{font-size:11px;color:var(--pri);background:var(--pri-bg);padding:3px 10px;border-radius:12px;font-weight:600;white-space:nowrap;border:1px solid var(--pri-bd)}
.topbar-r{display:flex;align-items:center;gap:6px}
.streak-badge{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--acc);background:var(--acc-bg);padding:5px 10px;border-radius:12px;border:1px solid var(--acc-bd)}
.theme-btn{background:var(--bg-input);border:1px solid var(--brd);color:var(--t2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.theme-btn:hover{background:var(--bg-side-h);transform:rotate(20deg)}

/* TABS */
.tabs{display:flex;gap:2px;padding:0 20px;background:var(--bg-card);border-bottom:1px solid var(--brd);flex-shrink:0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{white-space:nowrap;flex:0 0 auto}
.tab-btn{padding:12px 18px;border:none;background:transparent;color:var(--t3);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:var(--tr);position:relative;display:flex;align-items:center;gap:6px}
.tab-btn:hover{color:var(--t2)}
.tab-btn.active{color:var(--pri)}
.tab-btn.active::after{content:'';position:absolute;bottom:-1px;left:14px;right:14px;height:2px;background:var(--pri);border-radius:1px 1px 0 0}

/* CONTENT */
.content-area{flex:1;overflow-y:auto;padding:28px;scrollbar-width:thin;scrollbar-color:var(--brd) transparent;background:var(--bg)}
.content-area::-webkit-scrollbar{width:6px}
.content-area::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
.tab-panel{display:none;animation:fadeUp .25s ease}
.tab-panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* LEARN */
.learn-content{max-width:860px}
.learn-content h2{font-size:22px;margin:36px 0 14px;padding-bottom:10px;border-bottom:2px solid var(--brd)}
.learn-content h2:first-child{margin-top:0}
.learn-content h3{font-size:17px;color:var(--pri);margin:24px 0 10px}
.learn-content h4{font-size:13px;color:var(--sec);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.learn-content p{font-size:14.5px;line-height:1.8;color:var(--t2);margin-bottom:12px}
.learn-content ul,.learn-content ol{margin:8px 0 16px 24px;color:var(--t2);font-size:14.5px;line-height:1.8}
.learn-content li{margin-bottom:5px}
.learn-content strong{color:var(--t1);font-weight:600}
.learn-content em{color:var(--pri);font-style:normal;font-weight:500}
.learn-content code{background:var(--pri-bg);color:var(--pri);padding:2px 7px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:13px;border:1px solid var(--pri-bd)}
.concept-box{background:var(--pri-bg);border:1px solid var(--pri-bd);border-left:4px solid var(--pri);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:16px 18px;margin:16px 0}
.concept-box h4{color:var(--pri);margin:0 0 6px;font-size:12.5px}
.concept-box p{margin:0;font-size:14px}
.concept-box.important{background:var(--dan-bg);border-color:var(--dan-bd);border-left-color:var(--dan)}.concept-box.important h4{color:var(--dan)}
.concept-box.tip{background:var(--sec-bg);border-color:var(--sec-bd);border-left-color:var(--sec)}.concept-box.tip h4{color:var(--sec)}
.concept-box.warn{background:var(--acc-bg);border-color:var(--acc-bd);border-left-color:var(--acc)}.concept-box.warn h4{color:var(--acc)}
.formula-box{background:var(--bg-code);border:1px solid var(--brd);border-left:4px solid var(--pri);border-radius:var(--radius-sm);padding:16px 20px;margin:16px 0;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--pri);text-align:center}
.example-box{background:var(--sec-bg);border:1px solid var(--sec-bd);border-left:4px solid var(--sec);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:16px 18px;margin:16px 0}
.example-box h4{color:var(--sec);margin:0 0 6px;font-size:12.5px}
.example-box p{margin:4px 0;font-size:14px}
.code-block{background:var(--bg-code);border:1px solid var(--brd);border-radius:var(--radius-sm);padding:16px 20px;margin:16px 0;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--pri);overflow-x:auto;white-space:pre;line-height:1.7}
.comparison-table,table{width:100%;border-collapse:separate;border-spacing:0;margin:16px 0;font-size:13.5px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--brd)}
.comparison-table th,table th{background:var(--th-bg);color:var(--th-c);padding:10px 14px;text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--brd)}
.comparison-table td,table td{padding:10px 14px;border-bottom:1px solid var(--brd);color:var(--t2)}
.comparison-table tr:last-child td,table tr:last-child td{border-bottom:none}
.comparison-table tbody tr:nth-child(even) td,table tbody tr:nth-child(even) td{background:var(--stripe)}

/* CHAPTER COMPLETE BUTTON */
.ch-complete-bar{display:flex;align-items:center;justify-content:space-between;background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--radius);padding:16px 20px;margin-top:32px;box-shadow:var(--sh)}
.ch-complete-bar .label{font-size:14px;font-weight:600;color:var(--t2)}
.ch-complete-bar .label em{font-style:normal}
.mark-done-btn{padding:10px 22px;border:none;border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:var(--tr);display:flex;align-items:center;gap:6px}
.mark-done-btn.todo{background:var(--pri);color:#fff}
.mark-done-btn.todo:hover{opacity:.9;transform:translateY(-1px);box-shadow:var(--sh-md)}
.mark-done-btn.completed{background:var(--sec-bg);color:var(--sec);border:1px solid var(--sec-bd);cursor:default}

/* QUIZ */
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.quiz-header h3{font-size:18px}
.quiz-progress{display:flex;align-items:center;gap:10px}
.progress-bar{width:180px;height:6px;background:var(--bg-input);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--sec));border-radius:3px;transition:width .4s}
.progress-text{font-size:12px;color:var(--t3);font-weight:600}
.quiz-score{display:flex;gap:8px}
.score-badge{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:4px 12px;border-radius:14px}
.score-correct{color:var(--sec);background:var(--sec-bg);border:1px solid var(--sec-bd)}
.score-wrong{color:var(--dan);background:var(--dan-bg);border:1px solid var(--dan-bd)}
.quiz-card{background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--radius);padding:22px;margin-bottom:14px;box-shadow:var(--sh);transition:var(--tr)}
.quiz-card.answered-correct{border-color:var(--sec-bd);background:var(--sec-bg)}
.quiz-card.answered-wrong{border-color:var(--dan-bd);background:var(--dan-bg)}
.q-number{font-size:11px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.q-text{font-size:15px;font-weight:500;line-height:1.6;margin-bottom:16px}
.q-options{display:flex;flex-direction:column;gap:8px}
.q-option{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;background:var(--bg);border:1px solid var(--brd);border-radius:var(--radius-sm);cursor:pointer;transition:var(--tr);font-size:14px;color:var(--t2);line-height:1.5}
.q-option:hover:not(.disabled){background:var(--bg-side-h);border-color:var(--pri-bd);color:var(--t1)}
.q-option .opt-letter{width:26px;height:26px;border-radius:50%;background:var(--bg-input);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:var(--t3);transition:var(--tr);border:1px solid var(--brd)}
.q-option.correct{background:var(--sec-bg)!important;border-color:var(--sec)!important}
.q-option.correct .opt-letter{background:var(--sec)!important;color:#fff!important;border-color:var(--sec)!important}
.q-option.wrong{background:var(--dan-bg)!important;border-color:var(--dan)!important}
.q-option.wrong .opt-letter{background:var(--dan)!important;color:#fff!important;border-color:var(--dan)!important}
.q-option.disabled{cursor:default;pointer-events:none}
.q-explanation{margin-top:14px;padding:12px 16px;background:var(--sec-bg);border:1px solid var(--sec-bd);border-radius:var(--radius-sm);display:none;font-size:13.5px;color:var(--t2);line-height:1.6}
.q-explanation.show{display:block;animation:fadeUp .3s}
.q-explanation strong{color:var(--sec)}
.quiz-reset{margin-top:20px;padding:10px 24px;background:var(--pri);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:var(--tr)}
.quiz-reset:hover{opacity:.9;transform:translateY(-1px)}
/* Quiz result banner */
.quiz-result{display:none;text-align:center;padding:24px;background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--brd);margin-top:16px;box-shadow:var(--sh)}
.quiz-result.show{display:block;animation:fadeUp .4s}
.quiz-result .big-emoji{font-size:48px;margin-bottom:8px}
.quiz-result .result-msg{font-size:18px;font-weight:700;margin-bottom:4px}
.quiz-result .result-sub{font-size:13px;color:var(--t3)}
.quiz-result .xp-earned{font-size:14px;font-weight:700;color:var(--pri);margin-top:8px}

/* PAST QUESTIONS */
.pq-card{background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh);transition:var(--tr)}
.pq-card:hover{border-color:var(--pri-bd)}
.pq-question{padding:16px 18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.pq-meta{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.pq-year{font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-bg);padding:3px 8px;border-radius:6px;border:1px solid var(--pri-bd)}
.pq-marks{font-size:10px;color:var(--t3);font-weight:500}
.pq-text{flex:1;font-size:14px;line-height:1.6;font-weight:500}
.pq-toggle{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--bg-input);display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:11px;transition:var(--tr);align-self:center;border:1px solid var(--brd)}
.pq-card.open .pq-toggle{transform:rotate(180deg);color:var(--pri);background:var(--pri-bg);border-color:var(--pri-bd)}
.pq-answer{max-height:0;overflow:hidden;transition:max-height .4s ease}
.pq-card.open .pq-answer{max-height:8000px;border-top:1px solid var(--brd)}
.pq-answer-inner{padding:18px 20px;font-size:14px;line-height:1.8;color:var(--t2)}
.pq-answer-inner h4{color:var(--sec);font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.5px}
.pq-answer-inner p{margin-bottom:10px}
.pq-answer-inner ul,.pq-answer-inner ol{margin:6px 0 12px 22px}
.pq-answer-inner li{margin-bottom:4px}
.pq-answer-inner strong{color:var(--t1)}
.pq-answer-inner table{font-size:13px}
.pq-answer-inner th{background:var(--th-bg);color:var(--th-c);padding:8px 12px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--brd)}
.pq-answer-inner td{padding:8px 12px;border-bottom:1px solid var(--brd)}
.pq-answer-inner .code-block{font-size:12px;margin:10px 0}
.pq-answer-inner .formula-box{font-size:13px;margin:10px 0}

/* MERGED QUESTION BANK BADGES */
.pq-repeat{font-size:10px;font-weight:700;color:#b45309;background:var(--acc-bg);border:1px solid var(--acc-bd);padding:2px 7px;border-radius:6px;white-space:nowrap}
.pq-pending{padding:16px 20px;font-size:12.5px;color:var(--t3);font-style:italic;background:var(--bg-input);line-height:1.7}
.pq-pending strong{color:var(--acc);font-style:normal}
.pq-card.practice{border-left:3px solid var(--acc-bd)}
.pq-count{font-size:12px;color:var(--t3);font-weight:500;margin-left:10px}
.pq-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pq-pill{font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--brd);background:var(--bg-card);color:var(--t2);cursor:pointer;font-family:inherit}
.pq-pill.on{background:var(--pri);border-color:var(--pri);color:#fff}

/* SEARCH */
.search-wrap{position:relative;flex:0 1 340px;min-width:190px;max-width:380px}
.ch-ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-badge,.menu-btn{flex-shrink:0}
.search-in{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--brd);background:var(--bg-input);color:var(--t1);border-radius:8px;font-family:inherit;font-size:13px;outline:none;transition:var(--tr)}
.search-in:focus{border-color:var(--pri);background:var(--bg-card)}
.search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:13px;pointer-events:none}
.search-res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--radius);box-shadow:var(--sh-md);max-height:62vh;overflow:auto;z-index:300;display:none}
.search-res.show{display:block}
.sr-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--brd-l);font-size:13px;line-height:1.5}
.sr-item:last-child{border-bottom:none}
.sr-item:hover,.sr-item.sel{background:var(--bg-side-h)}
.sr-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--pri);margin-right:6px}
.sr-meta{font-size:11px;color:var(--t3);margin-top:3px}
.sr-empty{padding:14px;font-size:13px;color:var(--t3)}
.mark-flash{outline:3px solid var(--acc);outline-offset:4px;border-radius:6px}

/* ANALYSIS */
.an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(188px,1fr));gap:12px;margin-bottom:18px}
.an-card{background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--radius);padding:16px;box-shadow:var(--sh)}
.an-card .k{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);font-weight:700}
.an-card .v{font-size:26px;font-weight:800;color:var(--pri);margin-top:6px;line-height:1.15}
.an-card .s{font-size:11.5px;color:var(--t3);margin-top:4px}
.an-sec{background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.an-sec h3{font-size:15px;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.bar-row .lbl{width:96px;color:var(--t2);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;min-width:60px;height:14px;background:var(--bg-input);border-radius:7px;overflow:hidden;display:block}
.bar-fill{display:block;height:14px;background:linear-gradient(90deg,var(--pri),var(--sec));border-radius:7px}
.bar-row .val{width:104px;text-align:right;color:var(--t3);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
.topic-row .t-lbl{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2)}
.topic-row .t-lbl strong{color:var(--pri)}
.topic-row .t-ch{color:var(--t3);font-size:11px;font-weight:600}
.topic-row .t-val{flex:0 0 82px;width:82px;text-align:right;color:var(--t3);white-space:nowrap}
.topic-row .bar-track{flex:0 0 160px;width:160px}

<script>
(function(){
'use strict';
const CH=window.CHAPTERS||{},KEY='sm-progress';
let cur=1,qs={},progress=JSON.parse(localStorage.getItem(KEY)||'{}');
if(!progress.xp)progress={xp:0,done:{},quizzes:0,totalQ:0,correctQ:0,streak:0,lastDay:''};
const meta=[
  {n:1,t:'Concept of Simulation',m:8,h:6,e:'📘'},
  {n:2,t:'Monte Carlo Method',m:6,h:4,e:'🎲'},
  {n:3,t:'Continuous Systems',m:6,h:5,e:'📈'},
  {n:4,t:'Queuing System',m:6,h:5,e:'🏦'},
  {n:5,t:'Verification & Validation',m:6,h:4,e:'✅'},
  {n:6,t:'Random Number Generation',m:12,h:6,e:'🔢'},
  {n:7,t:'Simulation Output Analysis',m:6,h:5,e:'📊'},
  {n:8,t:'Simulation Language',m:10,h:5,e:'💻'}
];
function save(){localStorage.setItem(KEY,JSON.stringify(progress))}
function updateStreak(){
  const today=new Date().toDateString();
  if(progress.lastDay!==today){
    const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
    if(progress.lastDay===yesterday.toDateString())progress.streak++;
    else if(progress.lastDay!==today)progress.streak=1;
    progress.lastDay=today;save();
  }
}
updateStreak();
function updateStats(){
  const doneCount=Object.keys(progress.done).length;
  const pct=progress.totalQ>0?Math.round(progress.correctQ/progress.totalQ*100):0;
  document.getElementById('xpVal').textContent=progress.xp+' XP';
  document.getElementById('xpFill').style.width=Math.min(progress.xp/800*100,100)+'%';
  document.getElementById('statChap').textContent=doneCount+'/8';
  document.getElementById('statQuiz').textContent=progress.quizzes;
  document.getElementById('statPct').textContent=pct+'%';
  document.getElementById('streakBadge').textContent='🔥 '+progress.streak;
  document.querySelectorAll('.nav-item').forEach(el=>{
    const ci=el.dataset.ch;
    if(progress.done[ci])el.classList.add('done');else el.classList.remove('done');
    el.classList.toggle('progress',!progress.done[ci]&&!!(progress.seen||{})[ci]);
  });
  updateTabBadges();
}
/* Theme */
const html=document.documentElement,tBtn=document.getElementById('themeBtn');
function setTheme(t){html.setAttribute('data-theme',t);tBtn.textContent=t==='dark'?'🌙':'☀️';localStorage.setItem('sm-theme',t)}
tBtn.onclick=()=>setTheme(html.getAttribute('data-theme')==='dark'?'light':'dark');
setTheme(localStorage.getItem('sm-theme')||'dark');
/* Toast */
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.innerHTML=msg;document.body.appendChild(t);
  setTimeout(()=>{t.classList.add('hide');setTimeout(()=>t.remove(),300)},2500);
}
/* Confetti */
function confetti(){
  const c=document.createElement('div');c.className='confetti-container';document.body.appendChild(c);
  const colors=['#5e6ad2','#4cb782','#e5a03d','#e5484d','#9a7fe0','#8b94e4'];
  for(let i=0;i<60;i++){const p=document.createElement('div');p.className='confetti-piece';p.style.left=Math.random()*100+'%';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDelay=Math.random()*1+'s';p.style.animationDuration=(2+Math.random()*2)+'s';p.style.borderRadius=Math.random()>.5?'50%':'2px';p.style.width=(6+Math.random()*8)+'px';p.style.height=(6+Math.random()*8)+'px';c.appendChild(p);}
  setTimeout(()=>c.remove(),4000);
}
/* ---------------- Helpers ---------------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function stripTags(s){return String(s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------------- Design layer helpers ---------------- */
/* Wide comparison tables scroll instead of breaking the reading column, and a
   cell that holds nothing but a number is right-aligned in tabular monospace so
   digit columns line up. Applied to the rendered HTML, so no chapter file,
   quiz question or past answer has to change. */
function enhanceContent(root){
  if(!root)return;
  root.querySelectorAll('table').forEach(tb=>{
    const p=tb.parentElement;
    if(!p||p.classList.contains('table-scroll'))return;
    const wrap=document.createElement('div');
    wrap.className='table-scroll';
    p.insertBefore(wrap,tb);wrap.appendChild(tb);
    // A long table gets a scrolling box and a pinned header so the column
    // titles stay visible while the numbers scroll.
    const rows=tb.querySelectorAll('tbody tr').length||tb.querySelectorAll('tr').length;
    if(rows>=9)wrap.classList.add('tall');
  });
  root.querySelectorAll('table td').forEach(td=>{
    if(td.classList.contains('num'))return;
    const t=td.textContent.trim();
    if(t&&t.length<=14&&/^[-+]?[\d][\d,]*\.?\d*%?$/.test(t))td.classList.add('num');
  });
}
/* ---------------- Chapter sections ---------------- */
/* A chapter is 30-60 screens of notes. Each h2 section gets its own chevron so
   one section can be folded away, and the chapter carries one Expand/Collapse
   All control. Sections start expanded: nothing is hidden unless asked. */
function buildSections(){
  const box=document.querySelector('#panel-learn .learn-content');
  if(!box||box.dataset.secs==='1')return;
  const kids=[...box.childNodes];
  let sec=null;
  kids.forEach(node=>{
    if(node.nodeType===1&&node.tagName==='H2'){
      sec=document.createElement('section');
      sec.className='learn-sec';
      box.insertBefore(sec,node);
      const head=document.createElement('div');
      head.className='sec-head';
      sec.appendChild(head);
      head.appendChild(node);
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='sec-toggle';
      btn.title='Collapse or expand this section';
      btn.setAttribute('aria-expanded','true');
      btn.innerHTML='<span class="caret">▼</span>';
      const target=sec;              // capture: `sec` moves on to the next heading
      btn.onclick=()=>toggleSection(target);
      head.appendChild(btn);
      return;
    }
    if(sec)sec.appendChild(node);
  });
  box.dataset.secs='1';
  const key='sm-collapsed-'+cur;
  let stored=[];
  try{stored=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){stored=[]}
  box.querySelectorAll('section.learn-sec').forEach((s,i)=>{if(stored.includes(i))setSection(s,false,false)});
}
function setSection(sec,open,remember){
  sec.classList.toggle('collapsed',!open);
  const b=sec.querySelector('.sec-toggle');
  if(b)b.setAttribute('aria-expanded',open?'true':'false');
  if(remember!==false){
    const all=[...document.querySelectorAll('#panel-learn section.learn-sec')];
    const idx=all.map(s=>s.classList.contains('collapsed'));
    try{localStorage.setItem('sm-collapsed-'+cur,JSON.stringify(idx.map((v,i)=>v?i:-1).filter(i=>i>=0)))}catch(e){}
  }
}
function toggleSection(sec){setSection(sec,sec.classList.contains('collapsed'))}
function setAllSections(open){
  document.querySelectorAll('#panel-learn section.learn-sec').forEach(s=>setSection(s,open,false));
  try{localStorage.setItem('sm-collapsed-'+cur,JSON.stringify(open?[]:[...document.querySelectorAll('#panel-learn section.learn-sec')].map((s,i)=>i)))}catch(e){}
  toast(open?'📖 All sections expanded':'📕 All sections collapsed');
}
/* Tab badges: what is behind each tab, and whether it is finished. The quiz
   badge turns green and shows the stored score once the chapter quiz is done. */
function updateTabBadges(){
  const c=CH[cur]||{},done=!!progress.done[cur],score=(progress.chapterQuiz||{})[cur];
  const set=(sel,text,cls,show)=>{
    const el=document.querySelector(sel);
    if(!el)return;
    el.textContent=text;
    el.className='tab-badge'+(cls?' '+cls:'');
    el.hidden=!show;
  };
  set('[data-badge="learn"]',done?'✓':'','done',done);
  set('[data-badge="quiz"]',score?score.pct+'%':String((c.quiz||[]).length||''),score?'done':'accent',(c.quiz||[]).length>0);
  set('[data-badge="past"]',String((c.past||[]).length||''),'accent',(c.past||[]).length>0);
}

/* ---------------- Global search ---------------- */
let IDX=[],SEARCH_HITS=[];
function buildIndex(){
  IDX=[];
  for(let n=1;n<=8;n++){
    const c=CH[n];if(!c)continue;const m=meta[n-1];
    String(c.learn||'').split(/(?=<h[23]>)/).forEach(p=>{
      const h=p.match(/<h[23]>([^<]*)<\/h[23]>/);
      const body=stripTags(p);if(body.length<40)return;
      IDX.push({ch:n,type:'note',title:h?h[1]:m.t,snip:body.slice(0,170),key:(h?h[1]:m.t)});
    });
    (c.quiz||[]).forEach(q=>IDX.push({ch:n,type:'quiz',title:q.q,snip:stripTags(q.explanation).slice(0,150),key:q.q.slice(0,45)}));
    (c.past||[]).forEach(q=>IDX.push({ch:n,type:'past',title:q.q,snip:(q.year||'')+' · '+(q.marks||'')+' marks'+(q.answer?' · model answer':' · practice question')+((q.occ||[]).length>1?' · also asked in '+(q.occ||[]).map(o=>o.year).join(', '):''),key:q.q.slice(0,45)}));
  }
}
function search(term){
  const t=term.trim().toLowerCase();if(t.length<2)return[];
  const words=t.split(/\s+/),scored=[];
  IDX.forEach(e=>{
    const title=e.title.toLowerCase(),hay=(title+' '+e.snip.toLowerCase());
    let s=0;words.forEach(w=>{if(hay.includes(w))s+=title.includes(w)?3:1});
    if(s>0)scored.push([s,e]);
  });
  scored.sort((a,b)=>b[0]-a[0]);
  return scored.slice(0,14).map(x=>x[1]);
}
function wireSearch(){
  const inp=document.getElementById('searchIn'),res=document.getElementById('searchRes');
  let sel=-1;
  const close=()=>{res.classList.remove('show');sel=-1};
  const draw=()=>{
    if(!SEARCH_HITS.length){res.innerHTML='<div class="sr-empty">No matches. Try "chi-square", "GPSS", "Markov", "auto-correlation".</div>';res.classList.add('show');return}
    res.innerHTML=SEARCH_HITS.map((e,i)=>'<div class="sr-item'+(i===sel?' sel':'')+'" data-i="'+i+'"><span class="sr-tag">'+(e.type==='note'?'Notes':e.type==='quiz'?'Quiz':'Past Q')+'</span>'+esc(e.title)+'<div class="sr-meta">Ch '+e.ch+' · '+esc(e.snip)+'</div></div>').join('');
    res.classList.add('show');
  };
  inp.addEventListener('input',()=>{SEARCH_HITS=search(inp.value);sel=-1;if(inp.value.trim().length<2){close();return}draw()});
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Escape'){close();inp.blur();return}
    if(ev.key==='ArrowDown'){ev.preventDefault();sel=Math.min(sel+1,SEARCH_HITS.length-1);draw();return}
    if(ev.key==='ArrowUp'){ev.preventDefault();sel=Math.max(sel-1,0);draw();return}
    if(ev.key==='Enter'&&SEARCH_HITS.length){ev.preventDefault();APP.gotoResult(sel<0?0:sel)}
  });
  res.addEventListener('click',ev=>{const it=ev.target.closest('.sr-item');if(it)APP.gotoResult(+it.dataset.i)});
  document.addEventListener('click',ev=>{if(!ev.target.closest('.search-wrap'))close()});
  document.addEventListener('keydown',ev=>{
    if(ev.key==='/'&&document.activeElement!==inp&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){ev.preventDefault();inp.focus();inp.select()}
  });
}
function gotoResult(i){
  const e=SEARCH_HITS[i];if(!e)return;
  load(e.ch);switchTab(e.type==='note'?'learn':e.type);
  document.getElementById('searchRes').classList.remove('show');
  setTimeout(()=>{
    const panel=document.getElementById(e.type==='note'?'panel-learn':(e.type==='quiz'?'panel-quiz':'panel-past'));
    const sel=e.type==='note'?'h2,h3':(e.type==='quiz'?'.quiz-card':'.pq-card');
    const key=e.key.replace(/\s+/g,' ').trim().slice(0,40).toLowerCase();
    const nodes=[...panel.querySelectorAll(sel)];
    const hit=nodes.find(n=>n.textContent.replace(/\s+/g,' ').trim().toLowerCase().includes(key));
    if(!hit)return;
    if(e.type==='past'&&hit.classList.contains('pq-card'))hit.classList.add('open');
    // A hit inside a folded section must reveal the section, or the jump would
    // land on something the reader cannot see.
    const sec=hit.closest('section.learn-sec');
    if(sec&&sec.classList.contains('collapsed'))setSection(sec,true,false);
    hit.scrollIntoView({behavior:'smooth',block:'center'});
    hit.classList.add('mark-flash');setTimeout(()=>hit.classList.remove('mark-flash'),2600);
  },80);
}

/* ---------------- Progress tools ---------------- */
function bankCounts(){
  let answered=0,pending=0,total=0,repeated=0;
  for(let n=1;n<=8;n++){const c=CH[n];if(!c)continue;(c.past||[]).forEach(q=>{total++;q.answer?answered++:pending++;if((q.repeats||1)>=2)repeated++})}
  return{answered,pending,total,repeated};
}
function exportProgress(){
  const data={exported:new Date().toISOString(),progress,version:1};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='simulation-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  toast('💾 Progress exported');
}
function importProgress(mode){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);const inc=d.progress||d;
        if(!inc||typeof inc!=='object')throw new Error('bad file');
        progress=(mode==='merge')?Object.assign({},progress,inc,{done:Object.assign({},progress.done,inc.done||{}),chapterQuiz:Object.assign({},progress.chapterQuiz,inc.chapterQuiz||{})}):inc;
        if(!progress.xp)progress={xp:0,done:{},quizzes:0,totalQ:0,correctQ:0,streak:0,lastDay:''};
        save();buildNav();updateStats();renderAnalysis();toast('📥 Progress imported');
      }catch(err){toast('❌ Could not read that file')}
    };
    r.readAsText(f);
  };
  inp.click();
}
function resetProgress(){
  if(!confirm('Reset all progress — XP, completed chapters, quiz scores and streak? This cannot be undone.'))return;
  localStorage.removeItem(KEY);localStorage.removeItem('sm-theme');location.reload();
}

/* ---------------- Mock exam ---------------- */
const EXAM_WEIGHTS=[8,6,6,6,6,12,6,10];
/* The paper's mark total is the sum of the weights - never a separate literal,
   so the header, the score and the breakdown denominators cannot drift apart. */
const EXAM_TOTAL=EXAM_WEIGHTS.reduce((a,b)=>a+b,0);
let EXAM=null,EXAM_TIMER=null;
function marksOf(s){const m=String(s||'').match(/\d+/g);if(!m)return 2;const v=m.reduce((a,b2)=>a+ +b2,0);return v>0?v:2}
/* Every subset of a chapter's answered questions that stays under cap,
   so the allocator can choose between several mark totals for each chapter. */
function chapterOptions(pool,cap){
  const dp=new Map();dp.set(0,[]);
  for(const it of pool){
    for(const [s,cb] of [...dp]){
      const ns=s+it.marks;
      if(ns<=cap&&!dp.has(ns))dp.set(ns,cb.concat([it]));
    }
  }
  return [...dp.entries()];
}
/* Assemble a paper that totals exactly EXAM_TOTAL marks.

   Each chapter prefers its own syllabus weight, but a chapter whose pool cannot
   hit that weight exactly (Ch 2, 4, 5 and 7 have no combination adding to 6)
   may take a slightly larger or smaller set instead. A global dynamic program
   then picks one option per chapter so that the paper still comes to EXAM_TOTAL
   with the smallest possible deviation from the published weights. */
function buildPaper(){
  const perCh={};
  for(let n=1;n<=8;n++){
    const c=CH[n];
    if(!c){perCh[n]=[[0,[]]];continue;}
    const pool=shuffle((c.past||[]).filter(q=>q.answer).map(q=>({ch:n,q,marks:marksOf(q.marks),repeats:q.repeats||1})));
    perCh[n]=chapterOptions(pool,EXAM_WEIGHTS[n-1]+5);
  }
  // State = total marks so far -> the lowest-deviation set of chapter picks
  // reaching that total. Comparing deviation (not just first-found) is what
  // lets the allocator keep every chapter close to its own weight.
  let states=new Map([[0,{dev:0,picks:[]}]]);
  for(let n=1;n<=8;n++){
    const weight=EXAM_WEIGHTS[n-1],next=new Map();
    for(const [tot,st] of states){
      for(const [sum,combo] of perCh[n]){
        const nt=tot+sum;
        if(nt>EXAM_TOTAL)continue;
        const dev=st.dev+Math.abs(sum-weight);
        const cur=next.get(nt);
        if(!cur||dev<cur.dev)next.set(nt,{dev,picks:st.picks.concat([{ch:n,sum,combo}])});
      }
    }
    if(next.size)states=next;
  }
  let best=null,bestScore=Infinity,bestTotal=0;
  for(const [tot,st] of states){
    const score=Math.abs(EXAM_TOTAL-tot)*10+st.dev;
    if(score<bestScore){bestScore=score;best=st.picks;bestTotal=tot}
  }
  const items=[];
  (best||[]).forEach(p=>p.combo.forEach(x=>items.push(x)));
  return items;
}
function startExam(){
  const items=buildPaper();
  EXAM={items,revealed:{},marked:{},submitted:false,

}

    res.querySelector('.big-emoji').textContent=emoji;

    res.classList.add('show');

  }

/* Past */
let pastFilter='all';
const normQ=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
/* Every wording this ONE question was asked with: the card's own text first,
   then each paper found by tools/extract_occurrences.py. Normalised text is the
   key, so a paper whose wording repeats the card's is not shown twice. */
function pastVariants(q){
  const out=[],seen=new Set();
  const add=(year,marks,text,primary,answer)=>{
    const k=normQ(text);
    if(!text||seen.has(k))return;
    seen.add(k);
    out.push({year:String(year||''),marks:String(marks==null?'':marks),text,primary:!!primary,answer:answer||null});
  };
  add(q.year,q.marks,q.q,true,q.answer);
  // variants first: a variant carries the model answer written for that paper,
  // an occurrence carries only the wording. Either way the wording is kept.
  (q.variants||[]).forEach(v=>add(v.year,v.marks,v.q,false,v.answer));
  (q.occ||[]).forEach(o=>add(o.year,o.marks,o.q,false,null));
  // Only offer "its own model answer" when it actually differs from the one on
  // the card - the same answer twice under two wordings reads like a bug.
  const flat=s=>String(s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
  const seenAnswers=new Set([flat(q.answer)]);
  out.forEach(v=>{
    if(v.primary||!v.answer){v.answer=null;return}
    const k=flat(v.answer);
    if(!k||seenAnswers.has(k)){v.answer=null;return}
    seenAnswers.add(k);
  });
  return out;
}
function renderPast(questions){
  const panel=document.getElementById('panel-past');
  if(!questions.length){panel.innerHTML='<p style="color:var(--t3)">No past questions available.</p>';return;}
  const rows=questions.map((q,i)=>({q,i}));
  const answered=rows.filter(r=>r.q.answer).length;
  const repeated=rows.filter(r=>(r.q.repeats||1)>=2).length;
  let list=rows;
  if(pastFilter==='answered')list=rows.filter(r=>r.q.answer);
  else if(pastFilter==='practice')list=rows.filter(r=>!r.q.answer);
  else if(pastFilter==='repeat')list=rows.filter(r=>(r.q.repeats||1)>=2);
  let h='<div class="pq-filter">'+
    pill('all','All '+rows.length)+pill('answered','✅ Model answers '+answered)+pill('practice','📝 Practice '+(rows.length-answered))+pill('repeat','🔥 Repeated '+repeated)+'</div>';
  if(list.length){
    h+='<div class="pq-tools">'+
      '<button class="an-btn" onclick="APP.pastAll(true)">▾ Open every answer</button>'+
      '<button class="an-btn" onclick="APP.pastAll(false)">▴ Close every answer</button>'+
      '<button class="an-btn" onclick="APP.pastAllVariants()">🔤 Show every wording</button></div>';
  }
  h+='<h3 style="font-size:18px;margin:0 0 16px">📝 Exam Questions <span class="pq-count">'+rows.length+' distinct questions · '+answered+' with a model answer · '+(rows.length-answered)+' practice</span></h3>';
  if(!list.length){h+='<p style="color:var(--t3)">No questions in this filter.</p>';panel.innerHTML=h;return;}
  list.forEach(r=>{
    const q=r.q,i=r.i,rep=q.repeats||1;
    const variants=pastVariants(q);
    const others=variants.filter(v=>!v.primary);
    const papers=[...new Set(variants.map(v=>v.year).filter(Boolean))];
    const freq=rep>=4?'high':(rep>=2?'mid':'low');
    const body=q.answer?('<div class="pq-answer-inner">'+q.answer+'</div>')
      :'<div class="pq-pending"><strong>Practice question — model answer not written yet.</strong><br>Kept on the site so nothing is missing from the question list. Attempt it from the chapter notes: the same topic is worked in the answered questions above.</div>';
    const more=others.length?('<div class="pq-more">'+
        '<button class="pq-more-btn" aria-expanded="false" onclick="APP.tVariants('+i+',event)">📄 Same question in '+papers.length+' paper'+(papers.length>1?'s':'')+' — show each wording <span class="caret">▼</span></button>'+
        '<div class="pq-variants" id="pv-'+i+'" hidden>'+variants.map((v,vi)=>
          '<div class="pq-variant'+(v.primary?' is-primary':'')+'">'+
          '<div class="pq-variant-meta">'+esc(v.year||'paper on record')+'<em>'+esc(v.marks?v.marks+' marks':'')+(v.primary?' · as written above':'')+'</em></div>'+
          '<p>“'+esc(v.text)+'”</p>'+
          (v.answer?'<button class="pq-var-btn" aria-expanded="false" onclick="APP.tVariantAnswer('+i+','+vi+',event)">▸ its own model answer<span class="caret">▼</span></button><div class="pq-var-answer" id="pva-'+i+'-'+vi+'" hidden></div>':'')+
          '</div>').join('')+
          (rep>papers.length?'<p class="pq-note">The question bank counts '+rep+' appearances in total; the remaining ones are paraphrases with no paper text on record.</p>':'')+
        '</div></div>'):'';
    h+='<div class="pq-card'+(q.answer?'':' practice')+'" id="pq-'+i+'"><div class="pq-question" role="button" tabindex="0" aria-expanded="false" aria-label="'+esc(q.year+' • '+q.marks+' marks: '+q.q).slice(0,140)+'" onclick="APP.tpq('+i+')">'+
      '<div class="pq-meta"><span class="pq-year">'+esc(q.year||'')+'</span><span class="pq-marks">'+esc(q.marks||'')+' marks</span>'+(rep>=2?'<span class="pq-repeat" data-freq="'+freq+'">🔥 Asked '+rep+'×</span>':'')+'</div>'+
      '<div class="pq-text">'+esc(q.q)+((papers.length>1)?'<div class="pq-papers">'+papers.map(y=>'<span class="pq-paper">'+esc(y)+'</span>').join('')+'</div>':'')+'</div><div class="pq-toggle">▼</div></div>'+
      '<div class="pq-answer">'+body+more+'</div></div>';
  });
  panel.innerHTML=h;
}
function pill(key,label){return '<button class="pq-pill'+(pastFilter===key?' on':'')+'" onclick="APP.pastFilter(\''+key+'\')">'+label+'</button>'}
function setPastFilter(f){pastFilter=f;if(CH[cur])renderPast(CH[cur].past||[])}
function tpq(i){
  const c=document.getElementById('pq-'+i);if(!c)return;
  c.classList.toggle('open');
  const head=c.querySelector('.pq-question');
  if(head)head.setAttribute('aria-expanded',c.classList.contains('open')?'true':'false');
}
/* A variant that has a model answer of its own can show it, still inside the
   one card: the wording and the answer written for that paper. */
function tVariantAnswer(i,vi,ev){
  if(ev)ev.stopPropagation();
  const box=document.getElementById('pva-'+i+'-'+vi);
  if(!box)return;
  const btn=box.previousElementSibling;
  if(box.hasAttribute('hidden')){
    if(!box.dataset.filled){
      const v=pastVariants((CH[cur].past||[])[i]||{})[vi];
      if(!v||!v.answer)return;
      box.innerHTML='<div class="pq-answer-inner">'+v.answer+'</div>';
      box.dataset.filled='1';
      enhanceContent(box);
    }
    box.removeAttribute('hidden');
    if(btn)btn.setAttribute('aria-expanded','true');
  }else{
    box.setAttribute('hidden','');
    if(btn)btn.setAttribute('aria-expanded','false');
  }
}
/* The one-click expander: reveal this question's other papers' wordings. */
function tVariants(i,ev){
  if(ev){ev.stopPropagation()}
  const box=document.getElementById('pv-'+i),btn=box&&box.previousElementSibling;
  if(!box)return;
  const open=box.hasAttribute('hidden');
  box.toggleAttribute('hidden',!open);
  if(btn)btn.setAttribute('aria-expanded',open?'true':'false');
}
function pastAll(open){
  document.querySelectorAll('#panel-past .pq-card').forEach(c=>{
    c.classList.toggle('open',open);
    const head=c.querySelector('.pq-question');
    if(head)head.setAttribute('aria-expanded',open?'true':'false');
  });
}
function pastAllVariants(){
  let any=false;
  document.querySelectorAll('#panel-past .pq-variants').forEach(v=>{if(v.hasAttribute('hidden'))any=true});
  document.querySelectorAll('#panel-past .pq-variants').forEach(v=>{
    v.toggleAttribute('hidden',!any);
    const b=v.previousElementSibling;if(b)b.setAttribute('aria-expanded',any?'true':'false');
  });
  document.querySelectorAll('#panel-past .pq-card').forEach(c=>{
    if(any)c.classList.add('open');
    const head=c.querySelector('.pq-question');
    if(head&&any)head.setAttribute('aria-expanded','true');
  });
}

/* Events */
/* One button, two jobs: on a laptop it compresses the sidebar to a rail of
   chapter numbers (remembered between visits); under 1025 px the sidebar is a
   drawer and the same button opens it. */
const appEl=document.querySelector('.app'),sideEl=document.getElementById('sidebar'),menuEl=document.getElementById('menuBtn');
const isDrawer=()=>window.matchMedia('(max-width:1024px)').matches;
function syncMenuBtn(){
  const on=isDrawer()?sideEl.classList.contains('open'):!appEl.classList.contains('rail');
  menuEl.setAttribute('aria-expanded',on?'true':'false');
  menuEl.textContent=isDrawer()?(sideEl.classList.contains('open')?'✕':'☰'):'☰';
}
function setRail(on,remember){
  appEl.classList.toggle('rail',on);
  menuEl.setAttribute('aria-expanded',on?'false':'true');
  menuEl.title=on?'Show the full chapter list':'Compress the chapter list';
  if(remember!==false){try{localStorage.setItem('sm-rail',on?'1':'0')}catch(e){}}
  syncMenuBtn();
}
menuEl.onclick=()=>{
  if(isDrawer()){sideEl.classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
  else setRail(!appEl.classList.contains('rail'));
  syncMenuBtn();
};
document.getElementById('overlay').onclick=()=>{sideEl.classList.remove('open');document.getElementById('overlay').classList.remove('show');syncMenuBtn()};
window.addEventListener('resize',()=>{
  if(!isDrawer()){sideEl.classList.remove('open');document.getElementById('overlay').classList.remove('show')}
  syncMenuBtn();
});
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
/* Persistent jump-to-top / next-chapter affordance: navigation should not live
   only in the sidebar. */
document.getElementById('fabTop').onclick=()=>document.getElementById('contentArea').scrollTo({top:0,behavior:'smooth'});
document.getElementById('fabNext').onclick=()=>load(cur<8?cur+1:1);
/* Keyboard access: the chapter nav and the past-question headers are divs with
   click handlers, so give them Enter/Space support to match the buttons. */
function wireKeys(){
  document.getElementById('chNav').addEventListener('keydown',ev=>{
    const el=ev.target.closest('.nav-item');
    if(!el||!(ev.key==='Enter'||ev.key===' '))return;
    ev.preventDefault();load(+el.dataset.ch);
  });
  document.getElementById('panel-past').addEventListener('keydown',ev=>{
    const el=ev.target.closest('.pq-question');
    if(!el||!(ev.key==='Enter'||ev.key===' '))return;
    ev.preventDefault();el.click();
  });
  document.getElementById('contentArea').addEventListener('keydown',ev=>{
    const el=ev.target.closest('.q-option');
    if(!el||!(ev.key==='Enter'||ev.key===' '))return;
    ev.preventDefault();el.click();
  });
}
buildNav();updateStats();buildIndex();wireSearch();wireKeys();load(1);
setRail(localStorage.getItem('sm-rail')==='1',false);
window.APP={load,ans,tpq,markDone,pastFilter:setPastFilter,gotoResult,exportProgress,importProgress,resetProgress,startExam,revealExam,markExam,submitExam,clearExam,
  sections:setAllSections,pastAll,pastAllVariants,tVariants,tVariantAnswer,setRail};
})();
</script>
