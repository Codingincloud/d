<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Simulation & Modeling — Study Portal | BCE7026</title>
<meta name="description" content="Gamified study portal for Simulation & Modeling BCE7026 - Purbanchal University">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
/* Layout, colour, type and rhythm tokens now live in assets/css/tokens.css
   (loaded above) so there is one source of truth for the whole portal. */
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t1);overflow:hidden;height:100vh;font-size:14.5px;line-height:1.7;transition:background .3s,color .3s}
h1,h2,h3,h4,h5{line-height:1.35;font-weight:700;color:var(--t1)}
a{color:var(--pri);text-decoration:none}
::selection{background:var(--pri);color:#fff}
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--bg-side);border-right:1px solid var(--brd);display:flex;flex-direction:column;flex-shrink:0;z-index:100;transition:var(--tr)}
.s-head{padding:18px 16px;border-bottom:1px solid var(--brd)}
.logo{display:flex;align-items:center;gap:11px}
.logo-i{width:42px;height:42px;background:linear-gradient(135deg,var(--pri),#3b4299);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}
.logo-t h1{font-size:14px;font-weight:700;letter-spacing:-.3px}
.logo-t p{font-size:11px;color:var(--t3);margin-top:1px}

/* XP BAR */
.xp-section{padding:12px 16px;border-bottom:1px solid var(--brd)}
.xp-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.xp-label span{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px}
.xp-label .xp-val{color:var(--pri);font-size:13px}
.xp-bar{height:8px;background:var(--bg-input);border-radius:4px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--sec));border-radius:4px;transition:width .6s ease}
.xp-stats{display:flex;gap:8px;margin-top:8px}
.xp-stat{flex:1;text-align:center;padding:6px 4px;background:var(--bg-input);border-radius:6px;font-size:11px;color:var(--t2)}
.xp-stat .num{display:block;font-size:16px;font-weight:800;color:var(--t1)}
.xp-stat .lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}

.ch-nav{flex:1;overflow-y:auto;padding:8px 10px;scrollbar-width:thin;scrollbar-color:var(--brd) transparent}
.ch-nav::-webkit-scrollbar{width:4px}
.ch-nav::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--tr);margin-bottom:2px;border:1px solid transparent;position:relative}
.nav-item:hover{background:var(--bg-side-h)}
.nav-item.active{background:var(--bg-side-a);border-color:var(--pri-bd)}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;height:60%;width:3px;background:var(--pri);border-radius:0 3px 3px 0}
.nav-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bg-input);color:var(--t3);flex-shrink:0;transition:var(--tr)}
.nav-item.active .nav-num{background:var(--pri);color:#fff}
.nav-item.done .nav-num{background:var(--sec);color:#fff}
.nav-label{font-size:12px;font-weight:500;color:var(--t2);line-height:1.3;flex:1}
.nav-item.active .nav-label{color:var(--t1);font-weight:600}
.nav-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.nav-marks{font-size:9px;color:var(--t3);background:var(--bg-input);padding:1px 6px;border-radius:8px;font-weight:600}
.nav-prog{width:36px;height:3px;background:var(--bg-input);border-radius:2px;overflow:hidden}
.nav-prog-fill{height:100%;background:var(--sec);border-radius:2px;transition:width .4s ease}
.s-foot{padding:12px 16px;border-top:1px solid var(--brd)}
.s-foot p{font-size:10px;color:var(--t3);text-align:center;line-height:1.5}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:var(--header-h);background:var(--bg-card);border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;box-shadow:var(--sh)}
.topbar-l{display:flex;align-items:center;gap:12px;min-width:0}
.menu-btn{background:var(--bg-input);border:1px solid var(--brd);color:var(--t2);width:36px;height:36px;border-radius:var(--radius-sm);cursor:pointer;font-size:16px;line-height:1;transition:var(--tr)}
.menu-btn:hover{background:var(--bg-side-h)}
.ch-ti{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-badge{font-size:11px;color:var(--pri);background:var(--pri-bg);padding:3px 10px;border-radius:12px;font-weight:600;white-space:nowrap;border:1px solid var(--pri-bd)}
.topbar-r{display:flex;align-items:center;gap:6px}
.streak-badge{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--acc);background:var(--acc-bg);padding:5px 10px;border-radius:12px;border:1px solid var(--acc-bd)}
.theme-btn{background:var(--bg-input);border:1px solid var(--brd);color:var(--t2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.theme-btn:hover{background:var(--bg-side-h);transform:rotate(20deg)}

/* TABS */
.tabs{display:flex;gap:2px;padding:0 20px;background:var(--bg-card);border-bottom:1px solid var(--brd);flex-shrink:0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{white-space:nowrap;flex:0 0 auto}
.tab-btn{padding:12px 18px;border:none;background:transparent;color:var(--t3);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:var(--tr);position:relative;display:flex;align-items:center;gap:6px}
.tab-btn:hover{color:var(--t2)}
.tab-btn.active{color:var(--pri)}
.tab-btn.active::after{content:'';position:absolute;bottom:-1px;left:14px;right:14px;height:2px;background:var(--pri);border-radius:1px 1px 0 0}

/* CONTENT */
.content-area{flex:1;overflow-y:auto;padding:28px;scrollbar-width:thin;scrollbar-color:var(--brd) transparent;background:var(--bg)}
.content-area::-webkit-scrollbar{width:6px}
.content-area::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
.tab-panel{display:none;animation:fadeUp .25s ease}
.tab-panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* LEARN */
.learn-content{max-width:860px}
.learn-content h2{font-size:22px;margin:36px 0 14px;padding-bottom:10px;border-bottom:2px solid var(--brd)}
.learn-content h2:first-child{margin-top:0}
.learn-content h3{font-size:17px;color:var(--pri);margin:24px 0 10px}
.learn-content h4{font-size:13px;color:var(--sec);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.learn-content p{font-size:14.5px;line-height:1.8;color:var(--t2);margin-bottom:12px}
.learn-content ul,.learn-content ol{margin:8px 0 16px 24px;color:var(--t2);font-size:14.5px;line-height:1.8}
.learn-content li{margin-bottom:5px}
.learn-content strong{color:var(--t1);font-weight:600}
.learn-content em{color:var(--pri);font-style:normal;font-weight:500}
.learn-content code{background:var(--pri-bg);color:var(--pri);padding:2px 7px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:13px;border:1px solid var(--pri-bd)}
.concept-box{background:var(--pri-bg);border:1px solid var(--pri-bd);border-left:4px solid var(--pri);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:16px 18px;margin:16px 0}
.concept-box h4{color:var(--pri);margin:0 0 6px;font-size:12.5px}
.concept-box p{margin:0;font-size:14px}
.concept-box.important{background:var(--dan-bg);border-color:var(--dan-bd);border-left-color:var(--dan)}.concept-box.important h4{color:var(--dan)}
.concept-box.tip{background:var(--sec-bg);border-color:var(--sec-bd);border-left-color:var(--sec)}.concept-box.tip h4{color:var(--sec)}
.concept-box.warn{background:var(--acc-bg);border-color:var(--acc-bd);border-left-color:var(--acc)}.concept-box.warn h4{color:var(--acc)}
.formula-box{background:var(--bg-code);border:1px solid var(--brd);border-left:4px solid var(--pri);border-radius:var(--radius-sm);padding:16px 20px;margin:16px 0;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--pri);text-align:center}
.example-box{background:var(--sec-bg);border:1px solid var(--sec-bd);border-left:4px solid var(--sec);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:16px 18px;margin:16px 0}
.example-box h4{color:var(--sec);margin:0 0 6px;font-size:12.5px}
.example-box p{margin:4px 0;font-size:14px}
.code-block{background:var(--bg-code);border:1px solid var(--brd);border-radius:var(--radius-sm);padding:16px 20px;margin:16px 0;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--pri);overflow-x:auto;white-space:pre;line-height:1.7}
.comparison-table,table{width:100%;border-collapse:separate;border-spacing:0;margin:16px 0;font-size:13.5px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--brd)}
.comparison-table th,table th{background:var(--th-bg);color:var(--th-c);padding:10px 14px;text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--brd)}
.comparison-table td,table td{padding:10px 14px;border-bottom:1px solid var(--brd);color:var(--t2)}
.comparison-table tr:last-child td,table tr:last-child td{border-bottom:none}
.comparison-table tbody tr:nth-child(even) td,table tbody tr:nth-child(even) td{background:var(--stripe)}

/* CHAPTER COMPLETE BUTTON */
.ch-complete-bar{display:flex;align-items:center;justify-content:space-between;background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--radius);padding:16px 20px;margin-top:32px;box-shadow:var(--sh)}
.ch-complete-bar .label{font-size:14px;font-weight:600;color:var(--t2)}
.ch-complete-bar .label em{font-style:normal}
.mark-done-btn{padding:10px 22px;border:none;border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:var(--tr);display:flex;align-items:center;gap:6px}
.mark-done-btn.todo{background:var(--pri);color:#fff}
.mark-done-btn.todo:hover{opacity:.9;transform:translateY(-1px);box-shadow:var(--sh-md)}
.mark-done-btn.completed{background:var(--sec-bg);color:var(--sec);border:1px solid var(--sec-bd);cursor:default}

/* QUIZ */
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.quiz-header h3{font-size:18px}
.quiz-progress{display:flex;align-items:center;gap:10px}
.progress-bar{width:180px;height:6px;background:var(--bg-input);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--sec));border-radius:3px;transition:width .4s}
.progress-text{font-size:12px;color:var(--t3);font-weight:600}
.quiz-score{display:flex;gap:8px}
.score-badge{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:4px 12px;border-radius:14px}
.score-correct{color:var(--sec);background:var(--sec-bg);border:1px solid var(--sec-bd)}
.score-wrong{color:var(--dan);background:var(--dan-bg);border:1px solid var(--dan-bd)}
.quiz-card{background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--radius);padding:22px;margin-bottom:14px;box-shadow:var(--sh);transition:var(--tr)}
.quiz-card.answered-correct{border-color:var(--sec-bd);background:var(--sec-bg)}
.quiz-card.answered-wrong{border-color:var(--dan-bd);background:var(--dan-bg)}
.q-number{font-size:11px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.q-text{font-size:15px;font-weight:500;line-height:1.6;margin-bottom:16px}
.q-options{display:flex;flex-direction:column;gap:8px}
.q-option{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;background:var(--bg);border:1px solid var(--brd);border-radius:var(--radius-sm);cursor:pointer;transition:var(--tr);font-size:14px;color:var(--t2);line-height:1.5}
.q-option:hover:not(.disabled){background:var(--bg-side-h);border-color:var(--pri-bd);color:var(--t1)}
.q-option .opt-letter{width:26px;height:26px;border-radius:50%;background:var(--bg-input);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:var(--t3);transition:var(--tr);border:1px solid var(--brd)}
.q-option.correct{background:var(--sec-bg)!important;border-color:var(--sec)!important}
.q-option.correct .opt-letter{background:var(--sec)!important;color:#fff!important;border-color:var(--sec)!important}
.q-option.wrong{background:var(--dan-bg)!important;border-color:var(--dan)!important}
.q-option.wrong .opt-letter{background:var(--dan)!important;color:#fff!important;border-color:var(--dan)!important}
.q-option.disabled{cursor:default;pointer-events:none}
.q-explanation{margin-top:14px;padding:12px 16px;background:var(--sec-bg);border:1px solid var(--sec-bd);border-radius:var(--radius-sm);display:none;font-size:13.5px;color:var(--t2);line-height:1.6}
.q-explanation.show{display:block;animation:fadeUp .3s}
.q-explanation strong{color:var(--sec)}
.quiz-reset{margin-top:20px;padding:10px 24px;background:var(--pri);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:var(--tr)}
.quiz-reset:hover{opacity:.9;transform:translateY(-1px)}
/* Quiz result banner */
.quiz-result{display:none;text-align:center;padding:24px;background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--brd);margin-top:16px;box-shadow:var(--sh)}
.quiz-result.show{display:block;animation:fadeUp .4s}
.quiz-result .big-emoji{font-size:48px;margin-bottom:8px}
.quiz-result .result-msg{font-size:18px;font-weight:700;margin-bottom:4px}
.quiz-result .result-sub{font-size:13px;color:var(--t3)}
.quiz-result .xp-earned{font-size:14px;font-weight:700;color:var(--pri);margin-top:8px}

/* PAST QUESTIONS */
.pq-card{background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh);transition:var(--tr)}
.pq-card:hover{border-color:var(--pri-bd)}
.pq-question{padding:16px 18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.pq-meta{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.pq-year{font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-bg);padding:3px 8px;border-radius:6px;border:1px solid var(--pri-bd)}
.pq-marks{font-size:10px;color:var(--t3);font-weight:500}
.pq-text{flex:1;font-size:14px;line-height:1.6;font-weight:500}
.pq-toggle{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--bg-input);display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:11px;transition:var(--tr);align-self:center;border:1px solid var(--brd)}
.pq-card.open .pq-toggle{transform:rotate(180deg);color:var(--pri);background:var(--pri-bg);border-color:var(--pri-bd)}
.pq-answer{max-height:0;overflow:hidden;transition:max-height .4s ease}
.pq-card.open .pq-answer{max-height:8000px;border-top:1px solid var(--brd)}
.pq-answer-inner{padding:18px 20px;font-size:14px;line-height:1.8;color:var(--t2)}
.pq-answer-inner h4{color:var(--sec);font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.5px}
.pq-answer-inner p{margin-bottom:10px}
.pq-answer-inner ul,.pq-answer-inner ol{margin:6px 0 12px 22px}
.pq-answer-inner li{margin-bottom:4px}
.pq-answer-inner strong{color:var(--t1)}
.pq-answer-inner table{font-size:13px}
.pq-answer-inner th{background:var(--th-bg);color:var(--th-c);padding:8px 12px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--brd)}
.pq-answer-inner td{padding:8px 12px;border-bottom:1px solid var(--brd)}
.pq-answer-inner .code-block{font-size:12px;margin:10px 0}
.pq-answer-inner .formula-box{font-size:13px;margin:10px 0}

/* MERGED QUESTION BANK BADGES */
.pq-repeat{font-size:10px;font-weight:700;color:#b45309;background:var(--acc-bg);border:1px solid var(--acc-bd);padding:2px 7px;border-radius:6px;white-space:nowrap}
.pq-pending{padding:16px 20px;font-size:12.5px;color:var(--t3);font-style:italic;background:var(--bg-input);line-height:1.7}
.pq-pending strong{color:var(--acc);font-style:normal}
.pq-card.practice{border-left:3px solid var(--acc-bd)}
.pq-count{font-size:12px;color:var(--t3);font-weight:500;margin-left:10px}
.pq-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pq-pill{font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--brd);background:var(--bg-card);color:var(--t2);cursor:pointer;font-family:inherit}
.pq-pill.on{background:var(--pri);border-color:var(--pri);color:#fff}

/* SEARCH */
.search-wrap{position:relative;flex:0 1 340px;min-width:190px;max-width:380px}
.ch-ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-badge,.menu-btn{flex-shrink:0}
.search-in{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--brd);background:var(--bg-input);color:var(--t1);border-radius:8px;font-family:inherit;font-size:13px;outline:none;transition:var(--tr)}
.search-in:focus{border-color:var(--pri);background:var(--bg-card)}
.search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:13px;pointer-events:none}
.search-res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--radius);box-shadow:var(--sh-md);max-height:62vh;overflow:auto;z-index:300;display:none}
.search-res.show{display:block}
.sr-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--brd-l);font-size:13px;line-height:1.5}
.sr-item:last-child{border-bottom:none}
.sr-item:hover,.sr-item.sel{background:var(--bg-side-h)}
.sr-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--pri);margin-right:6px}
.sr-meta{font-size:11px;color:var(--t3);margin-top:3px}
.sr-empty{padding:14px;font-size:13px;color:var(--t3)}
.mark-flash{outline:3px solid var(--acc);outline-offset:4px;border-radius:6px}

/* ANALYSIS */
.an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(188px,1fr));gap:12px;margin-bottom:18px}
.an-card{background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--radius);padding:16px;box-shadow:var(--sh)}
.an-card .k{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);font-weight:700}
.an-card .v{font-size:26px;font-weight:800;color:var(--pri);margin-top:6px;line-height:1.15}
.an-card .s{font-size:11.5px;color:var(--t3);margin-top:4px}
.an-sec{background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.an-sec h3{font-size:15px;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.bar-row .lbl{width:96px;color:var(--t2);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;min-width:60px;height:14px;background:var(--bg-input);border-radius:7px;overflow:hidden;display:block}
.bar-fill{display:block;height:14px;background:linear-gradient(90deg,var(--pri),var(--sec));border-radius:7px}
.bar-row .val{width:104px;text-align:right;color:var(--t3);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
.topic-row .t-lbl{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2)}
.topic-row .t-lbl strong{color:var(--pri)}
.topic-row .t-ch{color:var(--t3);font-size:11px;font-weight:600}
.topic-row .t-val{flex:0 0 82px;width:82px;text-align:right;color:var(--t3);white-space:nowrap}
.topic-row .bar-track{flex:0 0 160px;width:160px}
.an-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.an-btn{padding:9px 16px;border:1px solid var(--brd);background:var(--bg-card);color:var(--t1);border-radius:8px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:var(--tr)}
.an-btn:hover{border-color:var(--pri);color:var(--pri)}
.an-btn.danger:hover{border-color:var(--dan);color:var(--dan)}
.strategy-box{background:linear-gradient(135deg,var(--acc-bg),var(--bg-input));border:2px solid var(--acc-bd);border-radius:var(--radius);padding:18px}
.strategy-box h4{color:var(--acc);font-size:13px;margin:14px 0 6px}
.strategy-box h4:first-of-type{margin-top:0}
.strategy-box ul{margin-left:20px}
.strategy-box li{font-size:13px;line-height:1.65;color:var(--t2)}

/* MOCK EXAM */
.exam-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.exam-timer{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--dan);background:var(--dan-bg);border:1px solid var(--dan-bd);padding:6px 14px;border-radius:8px}
.exam-timer.calm{color:var(--sec);background:var(--sec-bg);border-color:var(--sec-bd)}
.exam-q{background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.exam-q .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.exam-q .qt{font-size:14px;font-weight:600;line-height:1.6;flex:1}
.exam-q .qm{font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-bg);border:1px solid var(--pri-bd);padding:3px 8px;border-radius:6px;white-space:nowrap}
.exam-q .qmeta{font-size:11px;color:var(--t3);margin-bottom:8px}
.exam-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.exam-marked{font-size:11px;font-weight:700;margin-left:auto}
.exam-result{background:var(--bg-card);border:2px solid var(--pri-bd);border-radius:var(--radius);padding:22px;text-align:center;margin-bottom:16px}
.exam-result .big{font-size:40px;font-weight:800;color:var(--pri)}
.exam-result .sub{font-size:13px;color:var(--t3);margin-top:6px}

.topbar-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0}

/* CONFETTI */
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;top:-20px;animation:confettiFall 3s ease-out forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg-card);border:1px solid var(--sec-bd);border-radius:var(--radius);padding:14px 20px;box-shadow:var(--sh-md);display:flex;align-items:center;gap:10px;z-index:9998;animation:slideIn .4s ease;font-size:13px;font-weight:600;color:var(--t1)}
.toast.hide{animation:slideOut .3s ease forwards}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;backdrop-filter:blur(2px)}
@media(max-width:1024px){
.search-wrap{min-width:120px}.topic-row .bar-track{display:none}.bar-row .val{width:78px}
/* The sidebar becomes a drawer well before the window is phone-sized: at 900 px
   a 288 px column left too little room for the notes. */
.sidebar{position:fixed;left:calc(-1*var(--sidebar-w) - 24px);top:0;z-index:120;height:100vh;box-shadow:var(--sh-md)}
.sidebar.open{left:0}
.overlay.show{display:block}
.tabs{padding:0 12px}
.topbar{padding:0 14px}
.ch-ti{font-size:14.5px}.streak-badge{display:none}
}
</style>
